<!doctype html><html lang="en"><meta charset="utf-8"><title>HDG replay</title><style>body{font-family:sans-serif;background:#edf1f5;margin:24px}main{max-width:1200px;margin:auto}img{width:100%;background:white}button,select,input{margin:8px;padding:8px}input{width:45%}</style><main><h1>HDG replay</h1><p>Blue:ego Orange:contact Gray:others</p><select id="scene">OPTIONS</select><button id="play">Play / Pause</button><button id="back">Previous</button><button id="next">Next</button><button id="hit">End</button><input id="slider" type="range" min="0"><span id="time"></span><img id="view"><p>Saved executed trajectories.</p></main><script>const demos=DATA;let t=0,timer=null;const $=id=>document.getElementById(id);function stop(){clearInterval(timer);timer=null}function draw(){const d=demos[$('scene').selectedIndex];$('slider').max=d.terminal_frame;$('slider').value=t;$('view').src='data:image/jpeg;base64,'+d.frames[t];$('time').textContent=(t/10).toFixed(1)+' s / '+(d.terminal_frame/10).toFixed(1)+' s'}$('scene').onchange=()=>{stop();t=0;draw()};$('slider').oninput=()=>{stop();t=+$('slider').value;draw()};$('back').onclick=()=>{stop();t=Math.max(0,t-1);draw()};$('next').onclick=()=>{stop();t=Math.min(+$('slider').max,t+1);draw()};$('hit').onclick=()=>{stop();t=+$('slider').max;draw()};$('play').onclick=()=>{if(timer){stop();return}if(t>=+$('slider').max)t=0;draw();timer=setInterval(()=>{t++;draw();if(t>=+$('slider').max)stop()},100)};draw();</script></html>
